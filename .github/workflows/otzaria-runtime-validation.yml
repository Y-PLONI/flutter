name: Validate Otzaria Windows engines at runtime

on:
  push:
    branches: ['otzaria-publish-*']
    paths: ['.github/otzaria-publish/validation.json', '.github/otzaria-engine/probes/**']

permissions:
  actions: read
  contents: read

jobs:
  validate:
    name: Windows runtime (${{ matrix.arch }})
    if: github.repository == 'Y-PLONI/flutter'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    env:
      OTZARIA_ARCH: ${{ matrix.arch }}
      OTZARIA_ENGINE_VERSION: 89c39edfdfae2949f6806e4a315c0c08522238b7
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/otzaria-publish
            .github/otzaria-engine/probes

      - name: Verify build result, test evidence and archives
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/otzaria-publish/publish.py --prepare-runtime $env:OTZARIA_ARCH

      - name: Run all variants with the same Flutter release application
        shell: pwsh
        run: |
          $env:OTZARIA_BUILD_ROOT = Join-Path ([IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE)) 'otz'
          New-Item -ItemType Directory -Path $env:OTZARIA_BUILD_ROOT | Out-Null
          .github/otzaria-engine/probes/run.ps1

      - name: Upload paragraph validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: otzaria-windows-${{ matrix.arch }}-paragraph-validation
          path: paragraph-validation/
          if-no-files-found: error
